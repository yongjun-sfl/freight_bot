services:
  mysql_db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      # Defaults to the EC2 host path; override locally via MYSQL_DATA_PATH in .env
      - ${MYSQL_DATA_PATH:-/home/ubuntu/SFL/freight_bot/mysql_data}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 3s
      timeout: 3s
      retries: 10

  telegram_bot:
    build: ./bot
    restart: always
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - MYSQL_HOST=mysql_db
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - DISPATCH_ALERT_CHANNEL_ID=8756175976

  # Nightly mysqldump to a host directory. The database was wiped once already
  # by a broken volume mount, and the leg records are now the evidence shown to
  # the client, so a single EBS volume is not enough to keep them on.
  db_backup:
    image: mysql:8.0
    restart: always
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      # MYSQL_PWD rather than -p, which would put the password in the process list
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ${BACKUP_PATH:-/home/ubuntu/SFL/freight_bot/backups}:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "backup: every ${BACKUP_INTERVAL_SECONDS:-86400}s, keeping ${BACKUP_KEEP_DAYS:-14} days"
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          target="/backups/$${MYSQL_DATABASE}-$${stamp}.sql.gz"
          # --single-transaction keeps InnoDB consistent without locking the bot out
          if mysqldump -h mysql_db -u root --single-transaction --routines \
               --events --no-tablespaces "$${MYSQL_DATABASE}" | gzip > "$${target}.part"; then
            mv "$${target}.part" "$${target}"
            echo "backup ok $${stamp} $$(du -h "$${target}" | cut -f1)"
          else
            # a partial dump is worse than none: it restores without error
            rm -f "$${target}.part"
            echo "BACKUP FAILED $${stamp}" >&2
          fi
          find /backups -name "$${MYSQL_DATABASE}-*.sql.gz" \
               -mtime +$${BACKUP_KEEP_DAYS} -delete 2>/dev/null || true
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
