# Test overlay. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm tests
#
# Reuses the mysql_db service from the base file but writes to a separate
# `shuttle_db_test` schema, so production data is never touched.
services:
  # MySQL's data dir must live on a native Docker volume, not the /mnt/c drvfs
  # mount -- InnoDB cannot initialise reliably on Windows-backed filesystems.
  mysql_db:
    volumes:
      - mysql_test_data:/var/lib/mysql

  tests:
    build: ./bot
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TEST_MYSQL_HOST=mysql_db
      - TEST_MYSQL_PORT=3306
      - TEST_MYSQL_USER=root
      - TEST_MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TEST_MYSQL_DATABASE=shuttle_db_test
    volumes:
      - ./bot:/src/bot:ro
      - ./tests:/src/tests:ro
      - ./pytest.ini:/src/pytest.ini:ro
      - ./requirements-dev.txt:/src/requirements-dev.txt:ro
    working_dir: /src
    command: >
      sh -c "pip install --no-cache-dir -q -r requirements-dev.txt &&
             pytest"

  # Replays a real day of Telegram messages through the bot and compares the
  # legs against the dispatcher's hand-entered log. Writes to a scratch
  # database; never touches production.
  #   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm replay
  replay:
    build: ./bot
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - TEST_MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REPLAY_EXPORT=${REPLAY_EXPORT:-/data/ChatExport_2026-08-29/result.json}
      - REPLAY_WORKBOOK=${REPLAY_WORKBOOK:-/data/SFL Log 08_2026.xlsx}
      - REPLAY_SHEET=${REPLAY_SHEET:-08282026}
      - REPLAY_PHOTOS=${REPLAY_PHOTOS:-0}
      - REPLAY_DRIVER=${REPLAY_DRIVER:-}
      - REPLAY_DEBUG=${REPLAY_DEBUG:-0}
    volumes:
      - ./bot:/src/bot:ro
      - ./tools:/tools:ro
      - ./data:/data:ro
    working_dir: /src
    command: >
      sh -c "pip install --no-cache-dir -q openpyxl && python /tools/replay.py"

volumes:
  mysql_test_data:
